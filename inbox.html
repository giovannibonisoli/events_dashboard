<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventAtlas — Inbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <style>
        .inbox-page { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
        .inbox-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
        .inbox-header h1 { font-family: 'Outfit', sans-serif; font-size: 24px; margin: 0; }
        .inbox-header .badge {
            background: var(--accent); color: #fff; border-radius: 20px;
            padding: 2px 12px; font-size: 13px; font-weight: 600;
            font-family: 'IBM Plex Mono', monospace;
        }
        .btn-back {
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text); padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-size: 14px; display: flex; align-items: center;
            gap: 6px; transition: all .2s;
        }
        .btn-back:hover { background: var(--bg-hover); }
        .inbox-empty {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
        }
        .inbox-empty i { font-size: 48px; margin-bottom: 16px; opacity: .4; }
        .inbox-empty h2 { font-family: 'Outfit', sans-serif; font-size: 20px; margin: 0 0 8px 0; }
        .inbox-list { display: flex; flex-direction: column; gap: 8px; }
        .inbox-item {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 16px 20px;
            display: flex; align-items: center; gap: 16px;
        }
        .inbox-item .item-info { flex: 1; min-width: 0; }
        .inbox-item .item-place {
            font-weight: 600; font-size: 14px; color: var(--text);
        }
        .inbox-item .item-meta {
            font-size: 12px; color: var(--text-muted); margin-top: 3px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .inbox-item .item-meta .reason {
            display: inline-block; padding: 1px 8px; border-radius: 4px;
            font-size: 10px; font-weight: 600; margin-left: 6px;
            text-transform: uppercase;
        }
        .inbox-item .item-meta .reason-date { background: #ff980022; color: #e65100; }
        .inbox-item .item-meta .reason-coords { background: #f4433622; color: #c62828; }
        .inbox-item .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .inbox-item .item-actions button {
            padding: 6px 14px; border-radius: 6px; font-size: 12px;
            font-weight: 600; font-family: 'Outfit', sans-serif;
            cursor: pointer; border: none; transition: all .2s;
            display: flex; align-items: center; gap: 4px;
        }
        .inbox-item .btn-validate-item {
            background: #15803d; color: #fff;
        }
        .inbox-item .btn-validate-item:hover { opacity: .85; }
    </style>
</head>
<body>
    <div class="inbox-page">
        <div class="inbox-header">
            <button class="btn-back" onclick="window.location.href='event_atlas.html'">
                <i class="fas fa-arrow-left"></i> Back to dashboard
            </button>
            <h1><i class="fas fa-inbox" style="color:var(--accent);"></i> Inbox</h1>
            <span class="badge" id="inboxCount">0</span>
        </div>
        <div id="inboxContent"></div>
    </div>

    <script>
        const categoryConfig = {
            'crime': { color: '#b71c1c', icon: 'fa-gavel', label: 'Crime' },
            'justice': { color: '#4a148c', icon: 'fa-balance-scale', label: 'Justice & Public Order' },
            'accidents': { color: '#bf360c', icon: 'fa-car-crash', label: 'Accidents & Emergencies' },
            'weather': { color: '#f57f17', icon: 'fa-cloud-rain', label: 'Weather Alerts' },
            'health': { color: '#1b5e20', icon: 'fa-heartbeat', label: 'Health' },
            'society': { color: '#01579b', icon: 'fa-users', label: 'Society & Daily Life' },
            'sport': { color: '#4e342e', icon: 'fa-futbol', label: 'Sport' },
            'culture': { color: '#880e4f', icon: 'fa-music', label: 'Culture & Entertainment' }
        };

        function formatDate(d) {
            if (!d) return '';
            if (typeof d === 'object' && d.year) {
                const y = d.year, m = String(d.month || 1).padStart(2, '0'), day = String(d.day || 1).padStart(2, '0');
                return `${day}/${m}/${y}`;
            }
            if (typeof d === 'string') {
                const [y, m, day] = d.split('-');
                return `${day}/${m}/${y}`;
            }
            return String(d);
        }

        // Helper to extract value from new schema (value + provenance)
        function getVal(obj) {
            if (!obj) return null;
            if (typeof obj === 'object' && 'value' in obj) return obj.value;
            if (typeof obj === 'object') return null;
            return obj;
        }

// Normalize event for inbox display
function normalizeEvent(e, lang = 'it') {
    const firstPlace = e.single_places?.[0] || {};
    let coordinates = { lat: null, lng: null };
    let geocoded_place = firstPlace.geocoded_name?.value || firstPlace.address?.value || '';
    
    // Language-aware crossroad naming
    const crossroadPrefix = lang === 'it' ? 'Incrocio tra ' : 'Intersection of ';
    const crossroadConjunction = lang === 'it' ? ' e ' : ' and ';
    const crossroadFallback = lang === 'it' ? ' e altro' : ' and other';
    const crossroadSingle = lang === 'it' ? 'Incrocio' : 'Intersection';
    
    if (e.place_type === 'intersection' && e.geocoded_intersection) {
        coordinates = {
            lat: parseFloat(getVal(e.geocoded_intersection.latitude)) || null,
            lng: parseFloat(getVal(e.geocoded_intersection.longitude)) || null
        };
        // Format crossroad name based on language
        const wayNames = (e.single_places || []).map(p => getVal(p.geocoded_name) || getVal(p.address)).filter(Boolean);
        if (wayNames.length >= 2) {
            geocoded_place = `${crossroadPrefix}${wayNames[0]}${crossroadConjunction}${wayNames[1]}`;
        } else if (wayNames.length === 1) {
            geocoded_place = `${crossroadPrefix}${wayNames[0]}${crossroadFallback}`;
        } else {
            geocoded_place = crossroadSingle;
        }
    } else if (e.place_type === 'single' || !e.place_type) {
        coordinates = {
            lat: parseFloat(getVal(firstPlace.latitude)) || null,
            lng: parseFloat(getVal(firstPlace.longitude)) || null
        };
        geocoded_place = getVal(firstPlace.geocoded_name) || getVal(firstPlace.address) || '';
    } else if (e.place_type === 'multiple') {
        const places = e.single_places || [];
        if (places.length > 0) {
            const lats = places.map(p => parseFloat(getVal(p.latitude))).filter(v => !isNaN(v));
            const lngs = places.map(p => parseFloat(getVal(p.longitude))).filter(v => !isNaN(v));
            if (lats.length > 0 && lngs.length > 0) {
                coordinates = {
                    lat: lats.reduce((a, b) => a + b, 0) / lats.length,
                    lng: lngs.reduce((a, b) => a + b, 0) / lngs.length
                };
            }
        }
        geocoded_place = places.map(p => getVal(p.geocoded_name) || getVal(p.address)).filter(Boolean).join(', ') || 'Multiple locations';
    }
    
    return {
        ...e,
        coordinates,
        geocoded_place,
        start_date: {
            year: getVal(e.start_date?.year),
            month: getVal(e.start_date?.month),
            day: getVal(e.start_date?.day)
        }
    };
}

        function getReason(event) {
            const norm = normalizeEvent(event, 'it');
            if (!norm.start_date || (typeof norm.start_date === 'object' && norm.start_date.year == null)) return 'INVALID DATE: ' + JSON.stringify(event.start_date);
            if (!norm.coordinates || norm.coordinates.lat == null || norm.coordinates.lng == null) return 'MISSING COORDINATES';
            return '';
        }

        async function loadInbox() {
            const container = document.getElementById('inboxContent');
            container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);"><i class="fas fa-spinner fa-spin" style="font-size:24px;"></i></div>';

            let validatedSet = new Set();
            try {
                const vResp = await fetch('/api/validated-news');
                if (vResp.ok) {
                    const vList = await vResp.json();
                    (vList || []).forEach(x => { if (x && x.url) validatedSet.add(x.url); });
                }
            } catch (e) {}

            try {
                const resp = await fetch('data/events.json');
                const data = await resp.json();
                const allEvents = data.events || data;

                // Normalize events for new schema
                const normalizedEvents = allEvents.map(e => normalizeEvent(e, 'it'));

                const invalid = normalizedEvents.filter(e =>
                    !e.start_date || (typeof e.start_date === 'object' && e.start_date.year == null) || !e.coordinates || e.coordinates.lat == null || e.coordinates.lng == null
                );

                document.getElementById('inboxCount').textContent = invalid.length;

                if (invalid.length === 0) {
                    container.innerHTML = `
                        <div class="inbox-empty">
                            <i class="fas fa-check-circle" style="color:#4caf50;"></i>
                            <h2>All clear</h2>
                            <p>No news items with missing dates or coordinates.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `<div class="inbox-list">${
                    invalid.map(e => {
                        const cfg = categoryConfig[e.category] || categoryConfig.crime;
                        const reason = getReason(e);
                        const reasonClass = !e.start_date?.year ? 'reason-date' : 'reason-coords';
                        const done = e.url && validatedSet.has(e.url);
                        const btnLabel = done ? 'Modify Validation' : 'Validate';
                        const btnIcon = done ? 'fa-pen-to-square' : 'fa-clipboard-check';
                        const doneBadge = done
                            ? `<span style="font-size:10px;font-weight:600;color:#15803d;background:#15803d14;border:1px solid #15803d44;padding:1px 7px;border-radius:10px;margin-left:6px;"><i class="fas fa-check-circle"></i> Validated</span>`
                            : '';

                        return `
                            <div class="inbox-item">
                                <div class="item-info">
                                    <div class="item-place">
                                        <i class="fas ${cfg.icon}" style="color:${cfg.color};width:16px;"></i>
                                        ${e.geocoded_place || 'Unknown place'}
                                        ${doneBadge}
                                    </div>
                                    <div class="item-meta">
                                        ${e.publication_date ? formatDate(e.publication_date) : '—'}
                                        ${e.newspaper ? ' · ' + e.newspaper : ''}
                                        <span class="reason ${reasonClass}"><i class="fas fa-exclamation-triangle"></i> ${reason}</span>
                                    </div>
                                </div>
                                <div class="item-actions">
                                    <button class="btn-validate-item" onclick="openInboxValidation('${e.url ? e.url.replace(/'/g, "\\'") : ''}')">
                                        <i class="fas ${btnIcon}"></i> ${btnLabel}
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')
                }</div>`;
            } catch (err) {
                container.innerHTML = `
                    <div class="inbox-empty">
                        <i class="fas fa-exclamation-triangle" style="color:#f44336;"></i>
                        <h2>Error loading data</h2>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        window.openInboxValidation = function(url) {
            if (!url) return;
            fetch('data/events.json')
                .then(r => r.json())
                .then(data => {
                    const allEvents = data.events || data;
                    const event = allEvents.find(e => e.url === url);
                    if (event) {
                        // Normalize for validation page
                        const normalized = normalizeEvent(event);
                        sessionStorage.setItem('validatingEvent', JSON.stringify(event)); // Store original for validation
                        window.location.href = 'validation.html';
                    }
                })
                .catch(console.error);
        };

        document.addEventListener('DOMContentLoaded', loadInbox);
    </script>
</body>
</html>
