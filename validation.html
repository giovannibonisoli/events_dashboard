<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventAtlas — Validation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="/node_modules/@recogito/text-annotator/dist/text-annotator.css" />
    <style>
        .validation-page { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
        .validation-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
        .validation-header h1 { font-family: 'Outfit', sans-serif; font-size: 24px; margin: 0; }
        .btn-back {
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text); padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-size: 14px; display: flex; align-items: center;
            gap: 6px; transition: all .2s;
        }
        .btn-back:hover { background: var(--bg-hover); }
        .validation-meta {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;
        }
        .validation-meta .meta-item {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 16px 20px;
        }
        .validation-meta .meta-item .meta-label {
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: .5px; font-family: 'IBM Plex Mono', monospace;
        }
        .validation-meta .meta-item .meta-value { font-size: 14px; color: var(--text); margin-top: 4px; }
        .category-tag {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 600;
        }
        .key-info-section { margin-top: 12px; }
        .key-info-section .key-info-title {
            font-size: 12px; font-weight: 600; color: var(--text-muted);
            font-family: 'IBM Plex Mono', monospace; text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: 8px;
        }

        .validation-fields { display: flex; flex-direction: column; gap: 8px; }
        .section-header {
            font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600;
            color: var(--text-muted); padding: 16px 0 4px 0;
            border-bottom: 1px solid var(--border); margin-bottom: 4px;
            display: flex; align-items: center; gap: 6px;
        }
        .multi-event-check {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 18px; margin-bottom: 4px;
        }
        .multi-event-radio {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 18px; margin-bottom: 4px;
        }
        .multi-event-radio .radio-group {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .multi-event-radio .radio-group label {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 8px; cursor: pointer;
            font-size: 12.5px; font-weight: 500; color: var(--text);
            border: 1.5px solid var(--border); transition: all .2s;
        }
        .multi-event-radio .radio-group label[data-value="single"] {
            color: #2e7d32; border-color: #4caf50;
        }
        .multi-event-radio .radio-group label[data-value="single"]:hover {
            background: #4caf50; color: #fff; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(76,175,80,.3);
        }
        .multi-event-radio .radio-group label[data-value="single"].selected {
            background: #4caf50; color: #fff; border-color: #4caf50;
        }
        .multi-event-radio .radio-group label[data-value="main_secondary"] {
            color: #01579b; border-color: #0288d1;
        }
        .multi-event-radio .radio-group label[data-value="main_secondary"]:hover {
            background: #0288d1; color: #fff; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(2,136,209,.3);
        }
        .multi-event-radio .radio-group label[data-value="main_secondary"].selected {
            background: #0288d1; color: #fff; border-color: #0288d1;
        }
        .multi-event-radio .radio-group label[data-value="multiple"] {
            color: #c62828; border-color: #f44336;
        }
        .multi-event-radio .radio-group label[data-value="multiple"]:hover {
            background: #f44336; color: #fff; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(244,67,54,.3);
        }
        .multi-event-radio .radio-group label[data-value="multiple"].selected {
            background: #f44336; color: #fff; border-color: #f44336;
        }
        .multi-event-radio .radio-group input[type="radio"] {
            display: none;
        }
        .multi-event-radio .field-name {
            font-family: 'IBM Plex Mono', monospace; font-size: 11px;
            font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px;
        }
        .multi-event-radio.disabled-others {
            border-color: #f44336;
        }
        .multi-event-radio.disabled-others .field-name { color: #c62828; }
        .multi-event-radio.disabled-others .field-name::after {
            content: ' — other validations disabled'; color: #c62828; font-weight: 400;
        }
        .multi-event-radio .radio-group.radio-disabled label {
            opacity: .4; pointer-events: none; cursor: not-allowed;
        }
        .validation-locked .validation-field,
        .validation-locked .ki-row {
            opacity: .45;
        }
        .validation-locked .validation-field .field-status button,
        .validation-locked .ki-row .ki-status button,
        .validation-locked .ki-row .btn-delete,
        .validation-locked .ki-add-btn,
        .validation-locked .sp-add-btn {
            opacity: .3; cursor: not-allowed;
        }
        .validation-locked .field-correction input,
        .validation-locked .field-correction textarea,
        .validation-locked .field-correction select,
        .validation-locked .sp-field-input {
            pointer-events: none; opacity: .5;
        }
        .sp-row.sp-disabled .validation-field {
            opacity: 0.4;
        }
        .sp-row.sp-disabled .validation-field .field-value {
            color: var(--text-muted);
        }
        .validation-field {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 18px;
            transition: border-color .2s;
        }
        .validation-field.status-wrong { border-color: #f44336; }
        .validation-field.status-correct { border-color: #4caf50; }
        .validation-field .field-row {
            display: flex; align-items: flex-start; gap: 12px;
        }
        .validation-field .field-info { flex: 1; min-width: 0; }
        .validation-field .field-name {
            font-family: 'IBM Plex Mono', monospace; font-size: 11px;
            font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: .5px;
        }
        .validation-field .field-value {
            font-size: 13.5px; color: var(--text); line-height: 1.5;
            word-break: break-word; margin-top: 2px;
        }
        .validation-field .field-value.null-value { color: var(--text-muted); font-style: italic; }
        .validation-field .field-value.url-value a { color: var(--accent); text-decoration: none; }
        .validation-field .field-value.url-value a:hover { text-decoration: underline; }
        .validation-field .field-status {
            display: flex; gap: 3px; flex-shrink: 0;
        }
        .validation-field .field-status button {
            width: 32px; height: 32px; border-radius: 6px; border: 1.5px solid var(--border);
            background: transparent; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s; color: var(--text-muted);
        }
        .validation-field .field-status button:hover { background: var(--bg-hover); }
        .validation-field .field-status button.active-correct {
            background: #4caf50; color: #fff; border-color: #4caf50;
        }
        .validation-field .field-status button.active-wrong {
            background: #f44336; color: #fff; border-color: #f44336;
        }
        .validation-field .field-correction {
            display: none; margin-top: 10px; padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .validation-field .field-correction.show { display: block; }
        .validation-field .field-correction input,
        .validation-field .field-correction textarea {
            width: 100%; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg); color: var(--text);
            font-size: 13px; font-family: 'DM Sans', sans-serif;
        }
        .validation-field .field-correction textarea { min-height: 50px; resize: vertical; }
        .validation-field .field-correction .correction-label {
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            margin-bottom: 4px; font-family: 'IBM Plex Mono', monospace;
            text-transform: uppercase; letter-spacing: .3px;
        }
        .validation-prov-select {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border);
            border-radius: 6px; background: var(--bg); color: var(--text);
            font-size: 13px; font-family: 'DM Sans', sans-serif;
        }
        .validation-field .field-alert {
            display: flex; align-items: center; gap: 6px;
            margin-top: 8px; padding: 7px 12px; border-radius: 6px;
            font-size: 12px; font-weight: 500;
            background: #b71c1c22; color: #c62828; border: 1px solid #c6282844;
        }
        .places-warning, .news-warning {
            display: flex; align-items: center; gap: 8px;
            margin: 10px 0; padding: 10px 14px; border-radius: 8px;
            font-size: 13px; font-weight: 500;
            background: #b71c1c22; color: #c62828; border: 1px solid #c6282844;
        }
        .validation-field .multi-event-radio {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .validation-field .multi-event-radio-option {
            flex: 1; min-width: 130px;
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px; border-radius: 8px;
            border: 1.5px solid var(--border); background: var(--bg);
            cursor: pointer; font-size: 12px; font-weight: 500;
            color: var(--text); transition: all .2s;
        }
        .validation-field .multi-event-radio-option:hover {
            border-color: var(--accent);
        }
        .validation-field .multi-event-radio-option input[type="radio"] {
            width: auto; padding: 0; margin: 0;
            accent-color: var(--accent); cursor: pointer;
        }
        .validation-field .multi-event-radio-option:has(input:checked) {
            border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
        }
        .validation-field .correction-sp-radio {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .validation-field .correction-sp-radio .sp-radio-option {
            flex: 1; min-width: 110px;
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px; border-radius: 8px;
            border: 1.5px solid var(--border); background: var(--bg);
            cursor: pointer; font-size: 12px; font-weight: 500;
            color: var(--text); transition: all .2s;
        }
        .validation-field .correction-sp-radio .sp-radio-option:hover {
            border-color: var(--accent);
        }
        .validation-field .correction-sp-radio .sp-radio-option input[type="radio"] {
            width: auto; padding: 0; margin: 0;
            accent-color: var(--accent); cursor: pointer;
        }
        .validation-field .correction-sp-radio .sp-radio-option:has(input:checked) {
            border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
        }
        .validation-actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn-save-validation {
            background: var(--accent); color: #fff; border: none;
            padding: 12px 28px; border-radius: 8px; font-size: 14px;
            font-weight: 600; display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: opacity .2s;
        }
        .btn-save-validation:hover { opacity: .85; }
        .validation-notification {
            display: none; padding: 12px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 500; margin-top: 16px;
        }
        .validation-notification.success {
            display: block; background: #1b5e2022; color: #2e7d32; border: 1px solid #2e7d3244;
        }
        .validation-notification.error {
            display: block; background: #b71c1c22; color: #c62828; border: 1px solid #c6282844;
        }
        .no-event { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .no-event i { font-size: 48px; margin-bottom: 16px; opacity: .4; }
        .no-event h2 { font-family: 'Outfit', sans-serif; font-size: 20px; margin: 0 0 8px 0; }
        .progress-bar {
            height: 4px; background: var(--border); border-radius: 4px;
            margin-bottom: 24px; overflow: hidden;
        }
        .progress-bar .progress-fill {
            height: 100%; background: var(--accent); border-radius: 4px;
            transition: width .3s;
        }
        .progress-text {
            font-size: 12px; color: var(--text-muted); margin-bottom: 8px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .ki-row {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 16px;
            transition: border-color .2s;
        }
        .ki-row.status-wrong { border-color: #f44336; }
        .ki-row.status-correct { border-color: #4caf50; }
        .ki-row.status-deleted { border-color: #757575; opacity: .5; }
        .ki-row .ki-inputs { display: flex; gap: 8px; flex: 1; align-items: center; }
        .ki-row .ki-inputs input {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 6px 10px; font-size: 13px;
            color: var(--text); font-family: inherit;
        }
        .ki-row .ki-inputs input:disabled { opacity: .6; }
        .ki-row .ki-inputs input.ki-key { width: 160px; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; }
        .ki-row .ki-inputs input.ki-value { flex: 1; }
        .ki-row .ki-status { display: flex; gap: 3px; flex-shrink: 0; }
        .ki-row .ki-status button {
            width: 32px; height: 32px; border-radius: 6px; border: 1.5px solid var(--border);
            background: var(--bg); cursor: pointer; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center; transition: all .2s;
        }
        .ki-row .ki-status button:hover { background: var(--bg-hover); }
        .ki-row .ki-status button.active-correct { background: #4caf50; color: #fff; border-color: #4caf50; }
        .ki-row .ki-status button.active-wrong { background: #f44336; color: #fff; border-color: #f44336; }
        .ki-row .ki-status button.active-deleted { background: #757575; color: #fff; border-color: #757575; }
        .ki-row .ki-status button.btn-delete:hover { background: #f44336; color: #fff; border-color: #f44336; }
        .ki-add-btn {
            display: flex; align-items: center; gap: 6px; padding: 10px 16px;
            background: var(--bg-card); border: 1.5px dashed var(--border);
            border-radius: 10px; color: var(--text-muted); cursor: pointer;
            font-size: 13px; transition: all .2s; justify-content: center;
        }
        .ki-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }
        .sp-add-btn {
            display: flex; align-items: center; gap: 6px; padding: 10px 16px;
            background: var(--bg-card); border: 1.5px dashed var(--border);
            border-radius: 10px; color: var(--text-muted); cursor: pointer;
            font-size: 13px; transition: all .2s; justify-content: center;
        }
        .sp-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }
        .sp-field-input {
width: 100%; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg); color: var(--text);
            font-size: 13px; font-family: 'DM Sans', sans-serif;
        }
        .validation-field .new-field-wrap {
            display: flex; align-items: center; gap: 8px;
        }
        .validation-field .new-field-wrap .sp-field-input { flex: 1; width: auto; }
        .validation-field .new-field-none-label {
            font-size: 12px; color: var(--text-muted);
            display: flex; align-items: center; gap: 4px;
            cursor: pointer; white-space: nowrap; flex-shrink: 0;
        }
        .news-text-scroll {
            max-height: 440px; overflow-y: auto;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px;
        }
        .news-text-scroll.news-complete {
            border-color: #4caf50; box-shadow: 0 0 0 1px #4caf5055;
        }
        .news-text-scroll.news-invalid {
            border-color: #e53935; box-shadow: 0 0 0 1px #e5393555;
        }
        .news-text-scroll.news-locked {
            pointer-events: none; opacity: .55;
        }
        .news-text-scroll.news-locked .news-text-annotator { user-select: none; }
        .news-text-annotator {
            padding: 16px 20px; font-size: 14px; line-height: 1.75;
            color: var(--text); white-space: pre-wrap; word-break: break-word;
        }
        .news-text-annotator.no-text {
            white-space: normal; color: var(--text-muted); font-style: italic;
        }
        /* Keep the fill out of the border strip so the underline composites with
           the same alpha as the highlight instead of doubling it. */
        .news-text-annotator .r6o-span-highlight-layer .r6o-annotation {
            background-clip: padding-box;
        }
        .news-text-legend {
            display: flex; gap: 18px; font-size: 12px; color: var(--text-muted);
            padding: 0 2px 8px; align-items: center; flex-wrap: wrap;
        }
        .news-text-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .ref-swatch { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
        .ref-swatch.ref-loc { background: rgba(33,150,243,.35); border: 1px solid #2196f3; }
        .ref-swatch.ref-temporal { background: rgba(255,152,0,.4); border: 1px solid #ff9800; }
        .news-unmatched-box {
            margin-top: 14px; border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg-card); overflow: hidden;
        }
        .news-unmatched-box.news-complete {
            border-color: #4caf50; box-shadow: 0 0 0 1px #4caf5055;
        }
        .news-unmatched-box .section-header { margin: 0; }
        .news-unmatched-hint {
            padding: 8px 14px; font-size: 12px; color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        .news-unmatched-item {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; flex-wrap: wrap;
            padding: 10px 14px; border-bottom: 1px solid var(--border);
        }
        .news-unmatched-item:last-child { border-bottom: none; }
        .nu-main { display: flex; align-items: center; gap: 8px; min-width: 160px; }
        .nu-value {
            font-weight: 600; color: var(--text);
            font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
        }
        .nu-type {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: .4px; padding: 2px 7px; border-radius: 20px;
        }
        .nu-type-loc { background: rgba(33,150,243,.15); color: #2196f3; }
        .nu-type-temporal { background: rgba(255,152,0,.18); color: #ff9800; }
        .nu-choice { display: flex; align-items: center; gap: 8px; }
        .nu-option {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 8px; cursor: pointer;
            border: 1.5px solid var(--border); background: var(--bg);
            font-size: 12px; font-weight: 500; color: var(--text);
            transition: all .15s;
        }
        .nu-option:hover { border-color: #4caf50; }
        .nu-option input[type="radio"] { accent-color: #4caf50; cursor: pointer; }
        .nu-option:has(input:checked) {
            border-color: #4caf50;
            background: rgba(76,175,80,.12);
        }
        .nu-option.nu-disabled {
            opacity: .5; cursor: not-allowed;
        }
        .nu-option.nu-disabled:hover { border-color: var(--border); }
        .news-annot-popover {
            position: fixed; z-index: 10000;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.35);
            padding: 10px 12px; min-width: 210px;
            font-family: 'DM Sans', sans-serif; font-size: 12.5px; color: var(--text);
        }
        .news-annot-popover .nap-title {
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: .4px;
            font-family: 'IBM Plex Mono', monospace; margin-bottom: 8px;
        }
        .news-annot-popover .nap-row {
            display: flex; align-items: center; gap: 6px; margin-top: 6px;
        }
        .news-annot-popover .nap-label {
            font-size: 11px; color: var(--text-muted); margin-right: 2px;
        }
        .news-annot-popover .nap-btn {
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); border-radius: 6px; padding: 5px 10px;
            font-size: 12px; cursor: pointer; transition: all .15s;
        }
        .news-annot-popover .nap-btn:hover { background: var(--bg-hover); }
        .news-annot-popover .nap-btn.active {
            border-color: #2196f3; background: rgba(33,150,243,.15); font-weight: 600;
        }
        .news-annot-popover .nap-btn[data-type="temporal_expression"].active {
            border-color: #ff9800; background: rgba(255,152,0,.15);
        }
        .news-annot-popover .nap-btn.active-wrong {
            border-color: #616161; background: rgba(120,120,120,.25); font-weight: 600;
        }
        .news-annot-popover .nap-btn.nap-remove {
            margin-left: auto; color: #e57373; border-color: rgba(229,115,115,.5);
        }
        .news-annot-popover .nap-btn.nap-remove:hover {
            background: rgba(229,115,115,.15);
        }
    </style>
</head>
<body>
    <div class="validation-page">
        <div class="validation-header">
            <button class="btn-back" onclick="window.location.href='event_atlas.html'">
                <i class="fas fa-arrow-left"></i> Back to dashboard
            </button>
            <h1><i class="fas fa-clipboard-check" style="color:var(--accent);"></i> Validate Annotation</h1>
        </div>
        <div id="validationContent"></div>
    </div>

    <script src="recogito-env.js"></script>
    <script src="/node_modules/@recogito/text-annotator/dist/text-annotator.umd.js"></script>
    <script src="validation.js"></script>
</body>
</html>
